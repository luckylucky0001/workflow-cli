# Isolated, resettable demo environment. All business data is synthetic.
# Ports are offset (+10000) to avoid clashing with local services.
name: workctl-demo

services:
  mysql:
    image: mysql:8.4
    container_name: demo-mysql
    labels:
      workctl.resource: demo-mysql
      workctl.env: sandbox
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: demo
    command:
      - --performance-schema=ON
      - --slow-query-log=ON
      - --long-query-time=0.2
      - --log-output=TABLE
      - --max-connections=200
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./.runtime/secrets/mysql_root_password:/run/secrets/mysql_root_password:ro
      - ./.runtime/secrets/mysql_ro_password:/run/secrets/mysql_ro_password:ro
      - ./.runtime/secrets/mysql_app_password:/run/secrets/mysql_app_password:ro
      - mysql-data:/var/lib/mysql
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$(cat /run/secrets/mysql_root_password) --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4
    container_name: demo-redis
    labels:
      workctl.resource: demo-redis
      workctl.env: sandbox
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lfu
      - --slowlog-log-slower-than
      - "1000"
      - --slowlog-max-len
      - "256"
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    container_name: demo-kafka
    labels:
      workctl.resource: demo-mq
      workctl.env: sandbox
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "19092:19092"

  # OpenSearch single node for the demo-search plugin (search domain); security plugin disabled (sandbox only)
  search:
    image: opensearchproject/opensearch:2.19.3
    container_name: demo-search
    labels:
      workctl.resource: demo-search
      workctl.env: sandbox
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # sandbox host disk is >90% used; without this OpenSearch auto-applies cluster.blocks.create_index
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "19200:9200"

  demo-order:
    build: ../sample-service
    image: workctl-demo/demo-order:local
    container_name: demo-order
    labels:
      workctl.service: demo-order
      workctl.env: sandbox
      workctl.owner: team-demo
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: demo_app
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      MYSQL_DATABASE: demo
      REDIS_URL: redis://redis:6379
      CACHE_MODE: normal
      CACHE_TTL_SECONDS: "300"
      PORT: "8080"
    volumes:
      - ./.runtime/secrets/mysql_app_password:/run/secrets/mysql_app_password:ro
    ports:
      - "18081:8080"
    # structured logs (incl. span records) are read back by `workctl log query` / `trace get`;
    # rotation bounds disk use and is reported in the log query coverage notes
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: demo-prometheus
    labels:
      workctl.resource: demo-prometheus
      workctl.env: sandbox
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "19090:9090"

  # Loki provider for `workctl log query` / `trace get` (profile workctl.loki.yaml).
  # Storage is the container filesystem (no volume): recreating the container drops the logs.
  loki:
    image: grafana/loki:3.5.5
    container_name: demo-loki
    labels:
      workctl.resource: demo-loki
      workctl.env: sandbox
    command:
      - -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports:
      - "13100:3100"

  # Ships the logs of containers labelled workctl.env to Loki via the Docker API (docker_sd_configs).
  promtail:
    image: grafana/promtail:3.5.5
    container_name: demo-promtail
    command:
      - -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
  # Trino coordinator (single node) for `sql query submit --engine trino`: built-in tpch / tpcds /
  # memory / jmx catalogs, no credentials (X-Trino-User declares the user; access control allow-all).
  trino:
    image: trinodb/trino:476
    container_name: demo-trino
    labels:
      workctl.resource: demo-trino
      workctl.env: sandbox
    volumes:
      # file-based access control: user `workctl` is read-only (database-side boundary)
      - ./trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino/rules.json:/etc/trino/rules.json:ro
    ports:
      - "18085:8080"

  # etcd v3 (single node) as the demo config center / service registry for `config get|diff`
  # and `discovery list` (HTTP/JSON gateway /v3/*). No auth in the sandbox; history is kept
  # until a compaction (no auto-compaction configured). Seed: demo/scenarios/config/seed.mjs.
  etcd:
    image: bitnamilegacy/etcd:3.5
    container_name: demo-etcd
    labels:
      workctl.resource: demo-etcd
      workctl.env: sandbox
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:12379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    ports:
      - "12379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      retries: 20

  # Nacos 2.x (standalone, embedded Derby) as a second config center / registry provider
  # (`config get|diff`, `discovery list` via the v1 Open API). Auth is off in the sandbox
  # (the login path is covered by unit tests). Seed: demo/scenarios/config/seed-nacos.mjs.
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: demo-nacos
    labels:
      workctl.resource: demo-nacos
      workctl.env: sandbox
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "18848:8848"

  # Consul dev agent (in-memory, ACL off) as the third provider: KV under config/ and the
  # catalog/health API. KV keeps no history. Seed: demo/scenarios/config/seed-consul.mjs.
  consul:
    image: hashicorp/consul:1.20
    container_name: demo-consul
    command: ["agent", "-dev", "-client=0.0.0.0"]
    labels:
      workctl.resource: demo-consul
      workctl.env: sandbox
    ports:
      - "18500:8500"

  # PostgreSQL 16 for the `pg` domain. Superuser password from secret; read-only role
  # workctl_ro is provisioned by postgres/provision-users.sh. Scenario: demo/scenarios/postgres.
  postgres:
    image: postgres:16-alpine
    container_name: demo-postgres
    labels:
      workctl.resource: demo-postgres
      workctl.env: sandbox
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      POSTGRES_DB: demo_orders
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top", "-c", "track_io_timing=on", "-c", "max_connections=100"]
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./.runtime/secrets/pg_superuser_password:/run/secrets/pg_superuser_password:ro
      - ./.runtime/secrets/pg_ro_password:/run/secrets/pg_ro_password:ro
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d demo_orders"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Jenkins LTS (core only, no setup wizard) as the deploy-system provider for `deploy ...`.
  # init.groovy.d creates user admin (password from the secret file) and the freestyle job
  # deploy-demo-order; builds are seeded by demo/scenarios/deploy/seed-jenkins.mjs.
  # Host port 18091 (18081 is taken by demo-order). Runs as root only to read the 0600 secret file.
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: demo-jenkins
    user: root
    labels:
      workctl.resource: demo-jenkins
      workctl.env: sandbox
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Xmx512m
    volumes:
      - ./jenkins/init.groovy.d:/var/jenkins_home/init.groovy.d:ro
      - ./.runtime/secrets/jenkins_admin_password:/run/secrets/jenkins_admin_password:ro
    ports:
      - "18091:8080"

volumes:
  mysql-data:
