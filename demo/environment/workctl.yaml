# workctl profile for the isolated demo environment.
# Credentials are referenced, never inlined: *_ref: file:... / env:...
# Secret files are generated by demo/environment/up.sh into .runtime/secrets (git-ignored).
schema_version: "1.0"
current_profile: demo
profiles:
  demo:
    description: 隔离演示环境（合成数据，可复位）
    env: sandbox
    data_mode: live
    allow_execute: true
    resources_file: ./bindings.yaml
    state_dir: ./.runtime/state
    defaults:
      mysql: demo-mysql
      postgres: demo-postgres
      redis: demo-redis
      docker: local
      prometheus: demo-prometheus
      airflow: demo-airflow
      spark: demo-spark
      trino: demo-trino
      catalog: demo
      kafka: demo-mq
      opensearch: demo-search
      etcd: demo-etcd
    endpoints:
      docker:
        local:
          socket: /var/run/docker.sock
      mysql:
        demo-mysql:
          host: 127.0.0.1
          port: 13306
          user: workctl_ro
          password_ref: file:.runtime/secrets/mysql_ro_password
          # Planning DDL needs no write privilege; execution uses a separate account.
          max_execution_time_ms: 5000
          sensitive_columns: [phone, email, id_card, address]
      postgres:
        demo-postgres:
          host: 127.0.0.1
          port: 15432
          user: workctl_ro
          password_ref: file:.runtime/secrets/pg_ro_password
          database: demo_orders
          # role-side boundary: default_transaction_read_only=on, SELECT only (internal_ledger not granted)
          statement_timeout_ms: 5000
          sensitive_columns: [phone, email, id_card, address]
      redis:
        demo-redis:
          host: 127.0.0.1
          port: 16379
      prometheus:
        demo-prometheus:
          url: http://127.0.0.1:19090
          metrics:
            request_latency:
              description: 请求延迟 p95（秒），按 service 聚合
              query: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="$service"}[1m])))
              unit: seconds
            request_rate:
              description: 每秒请求数
              query: sum(rate(http_requests_total{service="$service"}[1m]))
              unit: req/s
            error_rate:
              description: 5xx 比例
              query: sum(rate(http_requests_total{service="$service",code=~"5.."}[1m])) / sum(rate(http_requests_total{service="$service"}[1m]))
              unit: ratio
            cache_hit_ratio:
              description: 应用侧缓存命中率
              query: sum(rate(cache_requests_total{service="$service",result="hit"}[1m])) / sum(rate(cache_requests_total{service="$service"}[1m]))
              unit: ratio
            db_query_rate:
              description: 应用侧数据库查询速率
              query: sum(rate(db_queries_total{service="$service"}[1m]))
              unit: req/s
      # Loki log provider (used when defaults.logs: loki, see workctl.loki.yaml); docker stays the default here
      loki:
        demo-loki:
          url: http://127.0.0.1:13100
          labels: '{service="$service", env="$env"}'
          push_interval: 1s
      airflow:
        demo-airflow:
          url: http://127.0.0.1:18080
          api_version: v1
          username: admin
          password_ref: file:.runtime/secrets/airflow_admin_password
          timezone: Asia/Shanghai
      spark:
        demo-spark:
          history_url: http://127.0.0.1:18088
          spark_home: /opt/venvs/spark/lib/python3.12/site-packages/pyspark
          python: /opt/venvs/spark/bin/python
          driver_log_dir: ./.runtime/spark/driver-logs
          event_log_dir: ./.runtime/spark/events
          query_state_dir: ./.runtime/spark/queries
          warehouse_root: ./.runtime/warehouse
          submit_script: ../offline-workflows/spark/spark-submit.sh
      trino:
        demo-trino:
          url: http://127.0.0.1:18085
          user: workctl
          catalog: tpch
          schema: tiny
          source: workctl
      catalog:
        demo:
          provider: file
          metadata_dir: ../catalog
          warehouse_root: ./.runtime/warehouse
          storage: local-filesystem
      kafka:
        demo-mq:
          brokers: [127.0.0.1:19092]
          client_id: workctl
      opensearch:
        demo-search:
          url: http://127.0.0.1:19200
      # etcd v3 config center / service registry (JSON gateway); sandbox runs without auth
      etcd:
        demo-etcd:
          url: http://127.0.0.1:12379
          config_prefix: /config/
          discovery_prefix: /services/
      # Nacos 2.x config center / registry (Open API); auth off in the sandbox. Selected per service
      # through bindings (demo-payment → demo-nacos). With auth on: username + password_ref.
      nacos:
        demo-nacos:
          url: http://127.0.0.1:18848
          context_path: /nacos
          namespace: ${env}
          group: DEFAULT_GROUP
          data_id: ${service}.properties
      # Consul KV + catalog/health (dev agent, ACL off). Selected via bindings (demo-inventory → demo-consul).
      # With ACL on: token_ref (sent as X-Consul-Token).
      consul:
        demo-consul:
          url: http://127.0.0.1:18500
          config_prefix: config/
      # Jenkins deploy system (docker-compose service jenkins, job deploy-demo-order)
      jenkins:
        demo-jenkins:
          url: http://127.0.0.1:18091
          user: admin
          password_ref: file:.runtime/secrets/jenkins_admin_password
