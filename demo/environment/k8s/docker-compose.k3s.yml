# k3s (Kubernetes v1.31) for the workctl Kubernetes provider demo.
# Equivalent to k3s-up.sh's `docker run`; requires a host that allows privileged containers.
#   docker compose -f demo/environment/k8s/docker-compose.k3s.yml up -d
# then copy /etc/rancher/k3s/k3s.yaml out as k3s-up.sh does (server → https://127.0.0.1:16443).
services:
  k3s:
    image: rancher/k3s:v1.31.4-k3s1
    container_name: workctl-k3s
    command: server --disable=traefik --tls-san=127.0.0.1
    privileged: true
    tmpfs: [/run, /var/run]
    environment:
      K3S_KUBECONFIG_MODE: "644"
    ports:
      - "127.0.0.1:16443:6443"
